<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgComp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d93ad"/>
      <stop offset="0.5" stop-color="#5c7591"/>
      <stop offset="1" stop-color="#8a99a8"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7e9ec"/>
      <stop offset="0.6" stop-color="#b6bac1"/>
      <stop offset="1" stop-color="#8b9098"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0a86a"/>
      <stop offset="1" stop-color="#a8642f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgComp)"/>
  <rect x="0" y="420" width="1200" height="210" fill="#4a5d73" opacity="0.5"/>

  <!-- valve block 1 -->
  <g>
    <rect x="140" y="280" width="180" height="130" rx="10" fill="url(#block)" stroke="#6b7280" stroke-width="2"/>
    <circle cx="180" cy="410" r="16" fill="#5c6067"/>
    <path d="M320 300 q60 -60 120 -20" stroke="url(#copper)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <rect x="300" y="255" width="30" height="45" rx="4" fill="url(#copper)"/>
  </g>

  <!-- valve block 2 (center, taller) -->
  <g>
    <rect x="470" y="230" width="200" height="200" rx="10" fill="url(#block)" stroke="#6b7280" stroke-width="2"/>
    <circle cx="510" cy="400" r="18" fill="#5c6067"/>
    <circle cx="630" cy="400" r="18" fill="#5c6067"/>
    <rect x="540" y="200" width="30" height="45" rx="4" fill="url(#copper)"/>
    <rect x="600" y="200" width="30" height="45" rx="4" fill="url(#copper)"/>
    <path d="M570 210 q40 -30 60 0" stroke="url(#copper)" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>

  <!-- valve block 3 -->
  <g>
    <rect x="800" y="290" width="190" height="140" rx="10" fill="url(#block)" stroke="#6b7280" stroke-width="2"/>
    <circle cx="960" cy="420" r="16" fill="#5c6067"/>
    <path d="M670 250 q70 -70 140 30" stroke="url(#copper)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <rect x="820" y="260" width="30" height="45" rx="4" fill="url(#copper)"/>
  </g>

  <!-- connecting tube between block1 and block2 -->
  <path d="M320 340 h150" stroke="url(#copper)" stroke-width="16" stroke-linecap="round"/>

  <!-- reflection line -->
  <rect x="0" y="0" width="1200" height="60" fill="#ffffff" opacity="0.08"/>
</svg>

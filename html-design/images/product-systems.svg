<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgSys" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9ccd1"/>
      <stop offset="1" stop-color="#9aa0a8"/>
    </linearGradient>
    <linearGradient id="metalBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f3f5"/>
      <stop offset="0.5" stop-color="#c3c7cc"/>
      <stop offset="1" stop-color="#9498a0"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aeb2b8"/>
      <stop offset="1" stop-color="#7d8189"/>
    </linearGradient>
    <linearGradient id="plinth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4a3a"/>
      <stop offset="1" stop-color="#5f2f24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgSys)"/>

  <!-- blueprint schematic overlay -->
  <g stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.35">
    <circle cx="980" cy="150" r="70"/>
    <circle cx="980" cy="150" r="45"/>
    <line x1="910" y1="150" x2="1050" y2="150"/>
    <line x1="980" y1="80" x2="980" y2="220"/>
    <rect x="120" y="60" width="180" height="120" rx="6"/>
    <line x1="120" y1="100" x2="300" y2="100"/>
    <line x1="160" y1="60" x2="160" y2="180"/>
    <circle cx="1050" cy="420" r="55"/>
    <path d="M1000 420 h100 M1050 370 v100"/>
    <path d="M60 400 q60 -40 120 0 t120 0" />
  </g>

  <!-- plinth board -->
  <rect x="130" y="470" width="640" height="60" rx="6" fill="url(#plinth)"/>
  <rect x="130" y="470" width="640" height="10" fill="#a5604a" opacity="0.6"/>

  <!-- pump main cylindrical body -->
  <rect x="330" y="300" width="260" height="150" rx="18" fill="url(#metalBody)" stroke="#7d8189" stroke-width="2"/>
  <circle cx="330" cy="375" r="75" fill="url(#metalBody)" stroke="#7d8189" stroke-width="2"/>
  <circle cx="330" cy="375" r="40" fill="url(#metalDark)"/>
  <circle cx="330" cy="375" r="14" fill="#5c6067"/>

  <!-- gauge -->
  <circle cx="470" cy="335" r="26" fill="#f4f6f8" stroke="#5c6067" stroke-width="3"/>
  <line x1="470" y1="335" x2="484" y2="322" stroke="#c0392b" stroke-width="2"/>
  <circle cx="470" cy="335" r="3" fill="#5c6067"/>

  <!-- reservoir bottle -->
  <rect x="405" y="200" width="46" height="130" rx="10" fill="#3a7bd5" opacity="0.85" stroke="#2c5aa0" stroke-width="2"/>
  <rect x="415" y="185" width="26" height="20" rx="4" fill="#c3c7cc" stroke="#7d8189" stroke-width="2"/>

  <!-- side ports and fittings -->
  <rect x="590" y="330" width="60" height="18" rx="4" fill="url(#metalDark)"/>
  <circle cx="660" cy="339" r="10" fill="#c9a227"/>
  <rect x="560" y="420" width="18" height="50" fill="url(#metalDark)"/>
  <rect x="380" y="450" width="18" height="20" fill="url(#metalDark)"/>
  <rect x="520" y="450" width="18" height="20" fill="url(#metalDark)"/>

  <!-- mounting bolts -->
  <circle cx="160" cy="500" r="8" fill="#3d2016"/>
  <circle cx="740" cy="500" r="8" fill="#3d2016"/>
</svg>
